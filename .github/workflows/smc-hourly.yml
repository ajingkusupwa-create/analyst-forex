name: Hourly Forex SMC Signals

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hourly-forex-smc-signals
  cancel-in-progress: false

jobs:
  scan:
    name: Scan Forex and Send Discord Signals
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Check required files
        run: |
          test -f requirements.txt || {
            echo "ERROR: requirements.txt tidak ditemukan"
            exit 1
          }
          test -f discord_scanner.py || {
            echo "ERROR: discord_scanner.py tidak ditemukan"
            exit 1
          }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate secrets
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          test -n "$TWELVE_DATA_KEY" || {
            echo "ERROR: TWELVE_DATA_KEY belum diatur"
            exit 1
          }
          test -n "$DISCORD_WEBHOOK_URL" || {
            echo "ERROR: DISCORD_WEBHOOK_URL belum diatur"
            exit 1
          }
          echo "Required secrets tersedia."

      - name: Run SMC scanner and Discord notifier
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PYTHONUNBUFFERED: '1'
        run: python discord_scanner.py
